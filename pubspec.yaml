name: ai_notes_assistant
description: A smart AI-powered note-taking mobile application.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.4
  cloud_firestore: ^5.6.2
  google_sign_in: ^6.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  connectivity_plus: ^6.1.3
  shared_preferences: ^2.5.2
  http: ^1.3.0
  google_generative_ai: ^0.4.5
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/
